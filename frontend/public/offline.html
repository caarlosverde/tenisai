<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Sin conexión — TenisAI</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(ellipse at top, #0b1a33 0%, #020617 45%, #000 100%);
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
        color: #fff;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #94a3b8;
      }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 14px 20px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(90deg, #67e8f9, #6ee7b7, #22d3ee);
        color: #020617;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #67e8f9;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.webp" alt="" />
      <h1>Sin conexión</h1>
      <p>
        TenisAI necesita internet para analizar tus vídeos y mostrar la comunidad. Comprueba tu
        conexión y vuelve a intentarlo.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
